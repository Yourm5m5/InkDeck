; =============================================================================
;  InkDeck firmware – PlatformIO project
;  Board: LilyGo T5 4.7" E-Paper S3 (ESP32-S3-WROOM-1-N16R8)
; =============================================================================
[env:inkdeck]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; 16 MB flash + 8 MB octal PSRAM (the N16R8 module on the LilyGo)
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM              ; lets ps_calloc() put the framebuffer in PSRAM
    -DLILYGO_T5_EPD47_S3           ; selects the S3 pin map inside the EPD library
    -DARDUINO_USB_CDC_ON_BOOT=1    ; Serial goes over the USB-C port

lib_deps =
    ; LilyGo's official e-paper driver (S3 branch). Provides epd_driver.h + fonts.
    https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#esp32s3

; PC tests for the EPUB converter + a full simulation of main.cpp live in
; pc_tests/ (run on a computer, not uploaded to the reader). See FIRMWARE.md §13.
